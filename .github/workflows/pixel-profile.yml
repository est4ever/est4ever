name: Pixel Profile

on:
  push:
    paths:
      - profile.json
      - .github/workflows/pixel-profile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Generate animated pixel art
        uses: TheMysteriousGhost/pixel-profile@ce302ba5b9f6c1c7f6ce21fdfd899bc09c897985
        with:
          config: profile.json
          out: assets
      - name: Commit generated assets if updated
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg assets/status.svg assets/divider.svg assets/footer.svg
          if git diff --cached --quiet; then
            echo "Pixel art unchanged"
            exit 0
          fi
          git commit -m "Update pixel-profile artwork"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying..."
          done
          exit 1
